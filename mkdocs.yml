site_name: geodompy
site_description: Acceso a datos geoespaciales estandarizados de República Dominicana en Python
site_url: https://drdsdaniel.github.io/geodompy
repo_url: https://github.com/drdsdaniel/geodompy
repo_name: drdsdaniel/geodompy

theme:
  name: material
  language: es
  palette:
    - scheme: default
      primary: blue
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro
    - scheme: slate
      primary: blue
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo claro
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang: es
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            show_source: true
            show_root_heading: true
            heading_level: 2
            members_order: source
            separate_signature: true
            show_signature_annotations: true

nav:
  - Inicio: index.md
  - Instalación: installation.md
  - Inicio Rápido: quickstart.md
  - Guías:
    - Funciones de Datos: guides/data-functions.md
    - Funciones de Limpieza: guides/cleaning-functions.md
    - Detección Automática: guides/detection.md
    - Mapeo: guides/mapping.md
  - Referencia API:
    - Datos: reference/data.md
    - Limpieza: reference/clean.md
    - Detección: reference/detect.md
    - Jerarquia: reference/hierarchy.md
    - Mapeo: reference/map.md
    - Caché: reference/cache.md
  - Artículos:
    - Mapeo con geodompy: articles/mapping.md
  - Changelog: changelog.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/drdsdaniel
    - icon: fontawesome/brands/twitter
      link: https://twitter.com/drdsdaniel

copyright: Copyright &copy; 2024 Daniel E. de la Rosa - Adatar
